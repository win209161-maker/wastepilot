name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 09:00 UTC (Mon, Thu, Sun pattern)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://adngsfaatzeuhycsiixl.supabase.co/rest/v1/organizations?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkbmdzZmFhdHpldWh5Y3NpaXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NTY2NTAsImV4cCI6MjEwODMzMjY1MH0.2-AK1Bje9qRuVzq3hySS7Cxjj1WcsPvkGdsZv98i8aA" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkbmdzZmFhdHpldWh5Y3NpaXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NTY2NTAsImV4cCI6MjEwODMzMjY1MH0.2-AK1Bje9qRuVzq3hySS7Cxjj1WcsPvkGdsZv98i8aA")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" -ge 500 ]; then exit 1; fi
